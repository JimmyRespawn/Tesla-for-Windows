<!doctype html><html lang="en"><meta charset="utf-8"><title>Side-view vehicle preview</title>
<style>body{margin:0;padding:28px;background:#f5f6f8;color:#17202b;font:14px system-ui}body.dark{background:#0f1319;color:#edf2f8}h1{font-size:24px}p{opacity:.7}.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{border:1px solid #8394a433;border-radius:18px;padding:18px;background:#ffffff55}.dark .card{background:#ffffff04}.scene{position:relative;aspect-ratio:400/267;overflow:hidden}.scene:before{content:"";position:absolute;width:80%;height:18%;left:10%;top:62%;background:#0003;border-radius:50%;filter:blur(8px);transform:rotate(-22deg)}.frame{position:absolute;inset:0;background-size:200% 200%;transition:opacity .42s}.charger{position:absolute;inset:0;pointer-events:none}label{display:inline-flex;gap:6px;padding:7px 4px}button,select{padding:8px 12px;border-radius:8px;border:1px solid #8a99aa55;background:transparent;color:inherit;margin:8px 4px}.status{min-height:36px;opacity:.75}.power{color:#189f6a}.dark .power{color:#56d7a3}</style>
<h1>Vehicle appearance · side view</h1><p>Offline preview. Door and charging controls below only simulate UI states.</p><button id="theme">Light / dark</button><div class="models"></div>
<script>
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
for(const model of ['model3','modely','models','modelx','cybertruck']){
 const c=document.createElement('section');c.className='card';c.innerHTML=`<h2>${model.replace('model','Model ')}</h2><div class="scene"></div><div class="inputs"></div><select><option value="Disconnected">Unplugged</option><option value="Stopped">Plugged in</option><option value="Charging">Charging</option><option value="Complete">Charge complete</option></select><div class="status"></div><div class="power"></div><button>Close all</button>`;document.querySelector('.models').append(c);
 const keys=['Front left','Rear left','Front right','Rear right'];let old=null,oldMask=-1;
 keys.forEach(k=>{let l=document.createElement('label');l.innerHTML=`<input type="checkbox">${k}`;c.querySelector('.inputs').append(l)});
 function update(){let v=[...c.querySelectorAll('input')].map(x=>x.checked),mask=(v[0]?1:0)|(v[1]?2:0);if(mask!==oldMask){let layer=document.createElement('div');layer.className='frame';layer.style.backgroundImage=`url(${model}-side.png)`;layer.style.backgroundPosition=`${mask%2*100}% ${Math.floor(mask/2)*100}%`;layer.style.opacity=old?0:1;c.querySelector('.scene').prepend(layer);let previous=old;old=layer;oldMask=mask;requestAnimationFrame(()=>requestAnimationFrame(()=>{layer.style.opacity=1;if(previous)previous.style.opacity=0}));setTimeout(()=>previous?.remove(),450)}c.querySelector('.status').textContent=keys.filter((_,i)=>v[i]).join(' · ')||'All doors closed';charge();}
 function charge(){c.querySelector('.charger')?.remove();const state=c.querySelector('select').value;c.querySelector('.power').textContent=state==='Disconnected'?'':state==='Charging'?'Charging · 32 kW':state==='Complete'?'Plugged in · Charge complete':'Plugged in · Waiting';if(state==='Disconnected')return;const portX={model3:366,modely:375,models:379,modelx:381,cybertruck:369}[model];const portY={model3:67,modely:64,models:64,modelx:69,cybertruck:109}[model];const color=state==='Charging'?'#28be7e':'#798ea4';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 400 267');svg.setAttribute('class','charger');svg.innerHTML=`<rect x="357" y="173" width="36" height="76" rx="8" fill="#eaeef2" stroke="#788392"/><rect x="363" y="182" width="24" height="48" rx="5" fill="${color}"/><path d="M357 213 C322 263 397 140 ${portX} ${portY}" fill="none" stroke="#252f3c" stroke-width="5" stroke-linecap="round"/><circle cx="${portX}" cy="${portY}" r="6" fill="${color}"/>`;c.querySelector('.scene').append(svg)}
 c.querySelector('select').onchange=charge;c.querySelectorAll('input').forEach(x=>x.onchange=update);c.querySelector('button').onclick=()=>{c.querySelectorAll('input').forEach(x=>x.checked=false);update()};update();}
</script></html>
